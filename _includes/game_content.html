{% assign game = site.data.games | where:"title", "simblocity" | first %}

<div class="row">
  <div class="col-md-2">
  <a href="https://itunes.apple.com/us/app/{{ game.title }}/id{{ game.apple_id }}?mt=8&uo=6&at=&ct=" target="itunes_store">
    <img src="{{ game.large_icon }}" style="height:80px;" class="img-thumbnail"/>
  </a>
</div>
<div class="col-md-10">
<h3>{{ game.name }}</h3><h4>{{ game.summary }}</h4></div></div>

<p>{{game.description}}</p>

<div class="row">
    <a class="app-store-button" href="https://itunes.apple.com/us/app/{{ game.title }}/id{{ game.apple_id }}?mt=8&uo=6&at=&ct=" target="itunes_store" style="display:inline-block;overflow:hidden;background:url(https://linkmaker.itunes.apple.com/images/badges/en-us/badge_appstore-lrg.png) no-repeat;width:165px;height:40px;@media only screen{background-image:url(https://linkmaker.itunes.apple.com/images/badges/en-us/badge_appstore-lrg.svg);}"></a>
  </div>
  
<section id="gallery" class="wrapper">
    <div class="container">
        <h3 class="animation-box wow bounceIn animated">Gallery</h3>
        <div class="virticle-line"></div>
        <div class="circle"></div>
        <div class="row">
            <div class="col-xs-12">
                <!-- Swiper -->
                <div class="swiper screenshots-swiper">
                    <div class="swiper-wrapper">
                        {% for i in (1..5) %}
                        <div class="swiper-slide">
                            <a href="/img/games/{{game.title}}/screens/iphone/{{i}}.png" data-lightbox-gallery="screenshots" class="wow flipInY animated">
                                <img src="/img/games/{{game.title}}/screens/iphone/{{i}}.png" class="img_res wow animated zoomIn" alt="Screenshot {{i}}" loading="lazy">
                            </a>
                        </div>
                        {% endfor %}
                    </div>
                    <!-- Add Pagination -->
                    <div class="swiper-pagination"></div>
                    <!-- Add Navigation -->
                    <div class="swiper-button-next"></div>
                    <div class="swiper-button-prev"></div>
                </div>
                <!-- Thumbnail Gallery -->
                <div class="swiper screenshots-thumbs">
                    <div class="swiper-wrapper">
                        {% for i in (1..5) %}
                        <div class="swiper-slide">
                            <img src="/img/games/{{game.title}}/screens/iphone/{{i}}.png" alt="Screenshot {{i}} thumbnail" loading="lazy">
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
